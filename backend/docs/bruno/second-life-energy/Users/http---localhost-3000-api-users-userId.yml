info:
  name: "http://localhost:3000/api/users/{{userId}}"
  type: http
  seq: 4

http:
  method: PUT
  url: "http://localhost:3000/api/users/{{userId}}"
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: "Pepe"
      - name: email
        type: text
        value: "pepenuevo@gmail.com"
      - name: password
        type: text
        value: "Demo1234!"
      - name: isActive
        type: text
        value: "false"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
