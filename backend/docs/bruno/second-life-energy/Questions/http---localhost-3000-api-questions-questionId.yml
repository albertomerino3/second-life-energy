info:
  name: "http://localhost:3000/api/questions/{{questionId}}"
  type: http
  seq: 4

http:
  method: PUT
  url: "http://localhost:3000/api/questions/{{questionId}}"
  body:
    type: json
    data: |-
      {
        "categoryId": 3,
        "title": "¿Cómo uso el sensor HC-SR04?",
        "content": "No consigo leer la distancia con Arduino Uno."
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
