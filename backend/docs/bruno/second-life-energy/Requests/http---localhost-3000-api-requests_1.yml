info:
  name: "http://localhost:3000/api/requests_1"
  type: http
  seq: 3

http:
  method: POST
  url: "http://localhost:3000/api/requests"
  body:
    type: json
    data: |-
      {
        "contactName": "Pepe",
        "contactEmail": "pepe@gmail.com",
        "notes": "Solicitud de prueba"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("requestId", res.body.id);
    - type: tests
      code: |-
        test("Status code is 201", function () {
          expect(res.status).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
