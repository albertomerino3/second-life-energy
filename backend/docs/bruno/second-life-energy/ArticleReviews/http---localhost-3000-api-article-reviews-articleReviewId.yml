info:
  name: "http://localhost:3000/api/article-reviews/{{articleReviewId}}"
  type: http
  seq: 4

http:
  method: PUT
  url: "http://localhost:3000/api/article-reviews/{{articleReviewId}}"
  body:
    type: json
    data: |-
      {
        "articleId": 3,
        "reviewerId": 2,
        "decision": "approved",
        "comments": "Kit completo y bien documentado"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
