info:
  name: "http://localhost:3000/api/article-reviews_1"
  type: http
  seq: 3

http:
  method: POST
  url: "http://localhost:3000/api/article-reviews"
  body:
    type: json
    data: |-
      {
        "articleId": 3,
        "reviewerId": 2,
        "decision": "approved",
        "comments": "Kit completo"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("articleReviewId", res.body.id);
    - type: tests
      code: |-
        test("Status code is 201", function () {
          expect(res.status).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
