info:
  name: "http://localhost:3000/api/article-images/{{articleImageId}}"
  type: http
  seq: 4

http:
  method: PUT
  url: "http://localhost:3000/api/article-images/{{articleImageId}}"
  body:
    type: json
    data: |-
      {
        "articleId": 4,
        "url": "/images/articles/resistencias-1.jpg",
        "altText": "Pack de resistencias variadas",
        "sortOrder": 1
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
