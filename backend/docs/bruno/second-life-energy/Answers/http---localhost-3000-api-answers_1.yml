info:
  name: "http://localhost:3000/api/answers_1"
  type: http
  seq: 3

http:
  method: POST
  url: "http://localhost:3000/api/answers"
  body:
    type: json
    data: |-
      {
        "questionId": 3,
        "authorId": 2,
        "content": "El kit solar da 500 mA, suficiente para una carga lenta."
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("answerId", res.body.id);
    - type: tests
      code: |-
        test("Status code is 201", function () {
          expect(res.status).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
