info:
  name: "http://localhost:3000/api/resources/{{resourceId}}"
  type: http
  seq: 4

http:
  method: PUT
  url: "http://localhost:3000/api/resources/{{resourceId}}"
  body:
    type: json
    data: |-
      {
        "title": "Introducción a Arduino Uno",
        "description": "Vídeo para empezar con Arduino",
        "type": "video",
        "topic": "Arduino",
        "difficulty": "beginner",
        "url": "https://www.youtube.com/results?search_query=arduino",
        "status": "published"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
